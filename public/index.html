<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пара слов — анонимная поддержка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 10px; font-size: 2rem; }
        .subtitle { color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 30px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; resize: none; margin-bottom: 15px; }
        textarea:focus { outline: none; border-color: #667eea; }
        .checkbox-label { display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; }
        .checkbox-label input { width: 20px; height: 20px; margin-right: 10px; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { transform: translateY(-2px); }
        .messages { margin-top: 30px; }
        .message { background: #f5f5f5; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .message-anon { font-style: italic; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💌 Пара слов</h1>
        <p class="subtitle">Отправь анонимное сообщение поддержки</p>
        <div class="card">
            <textarea id="messageText" placeholder="Напиши что-то доброе..."></textarea>
            <label class="checkbox-label">
                <input type="checkbox" id="isAnonymous" checked>
                Отправить анонимно
            </label>
            <button onclick="sendMessage()">Отправить</button>
        </div>
        <div class="messages" id="messagesList"></div>
    </div>
    <script>
        const API_URL = '';
        async function loadMessages() {
            try {
                const res = await fetch(API_URL + '/api/messages');
                const messages = await res.json();
                const list = document.getElementById('messagesList');
                list.innerHTML = messages.slice(-5).reverse().map(m => `
                    <div class="message">
                        ${m.isAnonymous ? '<span class="message-anon">Анонимно</span>' : ''}
                        <p>${m.text}</p>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }
        async function sendMessage() {
            const text = document.getElementById('messageText').value;
            const isAnonymous = document.getElementById('isAnonymous').checked;
            if (!text) return alert('Напиши сообщение!');
            await fetch(API_URL + '/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, isAnonymous })
            });
            document.getElementById('messageText').value = '';
            loadMessages();
        }
        loadMessages();
    </script>
</body>
</html>
